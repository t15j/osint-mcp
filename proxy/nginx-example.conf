# NICHT ohne vorgelagerte authentifizierende OAuth/OIDC-API-Gateway-Schicht einsetzen.
# Nginx allein mit diesem Snippet prüft KEINE Tokens!
# Hostname, TLS-Zertifikate, Limits und Auth-Gateway an eigene Umgebung anpassen.
upstream osint_mcp_upstream { server osint-mcp:8000; }
server {
    listen 443 ssl;
    server_name mcp.example.org;
    ssl_certificate     /etc/ssl/certs/fullchain.pem;
    ssl_certificate_key /etc/ssl/private/privkey.pem;
    client_max_body_size 64k;
    location = /mcp {
        # REQUIRED: insert a verified OAuth/OIDC access-control enforcement here.
        # Do not enable this server block until enforced at or before this location.
        proxy_pass http://osint_mcp_upstream/mcp;
        proxy_set_header Host localhost:8000; # MCP SDK local Host allowlist; gateway must sanitize headers
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
