services:
  osint-mcp:
    build: .
    image: osint-mcp-poc:local
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 384m
    cpus: 1.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    environment:
      LOG_LEVEL: INFO
      PYTHONUNBUFFERED: "1"
    expose:
      - "8000"
    networks:
      - osint_internal
    # No public ports. Reverse proxy must join osint_internal (or shared external proxy network).
networks:
  osint_internal:
    name: osint_mcp_internal
    driver: bridge
